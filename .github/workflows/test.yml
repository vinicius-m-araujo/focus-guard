name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focusguard-ui/package-lock.json
      - name: Validate Windows desktop
        shell: pwsh
        run: ./scripts/validate-windows.ps1
      - name: Validate session log structure
        shell: bash
        run: bash scripts/check-session-log.sh
      - name: Build Windows ARM64
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          $env:CGO_ENABLED = '0'
          go build ./...
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-validation
          path: validation-results/

  windows-race:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Race detector
        shell: msys2 {0}
        run: |
          export CGO_ENABLED=1 CC=gcc
          go test -race ./... -count=1 -timeout=600s

